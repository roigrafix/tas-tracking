# render.yaml — TAS Track & Ship deployment config
# ===================================================
# Deploy this repo on Render: https://dashboard.render.com/new/web

services:
  - type: web
    name: tas-tracking
    runtime: node
    region: oregon
    plan: free

    # Build steps:
    # 1. NODE_ENV=development ensures npm installs ALL deps (including vite in devDependencies)
    # 2. Build the React frontend with Vite
    # 3. Install only production deps for the server
    buildCommand: NODE_ENV=development npm install && npm run build && npm --prefix server install --omit=dev

    # Start: Express serves both the API and the built frontend
    startCommand: node server/src/index.js

    # Health check endpoint
    healthCheckPath: /api/health

    # Environment variables
    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 3001

      - key: DB_PATH
        value: ./server/data/tas.db

      # Vite reads this at BUILD time to embed the reCAPTCHA site key
      - key: VITE_RECAPTCHA_SITE_KEY
        value: 6Lc3__YsAAAAAFEql5ku5d5SkbkfTV54XH54CGlC

      # JWT secrets — auto-generated by Render
      - key: JWT_ACCESS_SECRET
        generateValue: true

      - key: JWT_REFRESH_SECRET
        generateValue: true

      # Set these manually in the Render dashboard:
      # RECAPTCHA_SECRET_KEY = 6Lc3__YsAAAAAOoMPhZSUCHpML1HayX24imsiIee
      # FRONTEND_ORIGIN      = https://your-app.onrender.com
